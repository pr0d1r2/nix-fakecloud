# Build fakecloud natively on every tier-1 system.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One system failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          # Tier-1, each on its own architecture: no qemu, no cross-compiling.
          # A binary built under emulation is not the binary consumers fetch,
          # and aarch64-linux has a native runner, so there is no reason to
          # fake it (SPEC V2).
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Pushing is a main-branch action. Pull requests -- including from forks,
      # which have no secrets at all -- build and prove they build, but do not
      # write to the cache (SPEC V5).
      #
      # The token must be a per-cache token with WRITE on `pr0d1r2`, not a
      # personal token: with the wrong scope cachix logs a 403 and the job
      # still goes green, which is exactly how ../nix-hk shipped an empty cache
      # for a while. T17's separate job is what actually catches that.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          # Upload what this repo produces, not the nixpkgs closure it merely
          # used -- cache.nixos.org already serves that, and mirroring it burns
          # our storage to no one's benefit (SPEC V10). The vendor tarball is
          # ours but is a build-time input consumers never fetch, so it is
          # filtered too.
          pushFilter: "(-source$|-vendor$|-vendor-staging$|\\.tar\\.gz$)"

      - name: Assert the pinned rustc is what builds it (SPEC V13)
        run: ./.github/scripts/assert-rustc.sh ${{ matrix.system }}

      - name: Build fakecloud
        run: nix build .#fakecloud --print-build-logs

      - name: Check the binary reports its own version (SPEC V1)
        run: ./result/bin/fakecloud --version | grep -q '0\.44\.10'


      # The VM test needs KVM, so it runs on the x86_64 Linux leg only. The
      # arm64 runner's nested-virtualisation support is not something this repo
      # has verified, and a check that fails for infrastructure reasons teaches
      # nobody anything. If it turns out to work there, widen this.
      - name: Run the NixOS module VM test
        if: matrix.system == 'x86_64-linux'
        run: nix build .#checks.x86_64-linux.module --print-build-logs
      - name: Record the store path for the cache check
        run: nix path-info .#fakecloud > store-path.txt

      - name: Publish the store path for the verify-cache job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-path-${{ matrix.system }}
          path: store-path.txt
          if-no-files-found: error

  verify-cache:
    name: verify cache
    # A separate job, not a step in the build job. cachix-action pushes from a
    # post-run hook, so an assertion inside the build job races it and can pass
    # before anything has been uploaded (SPEC V15, ../nix-hk B3-B5).
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: store-path-*
          path: store-paths

      - name: Assert every tier-1 path is in the cache and signed
        run: ./.github/scripts/verify-cache.sh store-paths

  eval:
    name: eval (all systems)
    # Cheap, and the only job that says anything about x86_64-darwin. Tier-2
    # means evaluated but not built or cached (SPEC V16) -- without this job
    # nothing would notice it breaking until someone tried to use it.
    #
    # `--all-systems` is the whole point: the bare form silently skips systems
    # the runner cannot evaluate, so a broken foreign system stays green
    # (SPEC V4). `--no-build` keeps this to evaluation; building is the
    # matrix's job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Assert nixpkgs matches nixpkgs-lock (SPEC V12)
        run: ./.github/scripts/assert-pin.sh

      - name: nix flake check --all-systems --no-build
        run: nix flake check --all-systems --no-build

      - name: Assert x86_64-darwin still evaluates (SPEC V16)
        run: nix eval --raw .#packages.x86_64-darwin.fakecloud.drvPath
