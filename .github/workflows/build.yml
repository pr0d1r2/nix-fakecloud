# Build fakecloud natively on every tier-1 system.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One system failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          # Tier-1, each on its own architecture: no qemu, no cross-compiling.
          # A binary built under emulation is not the binary consumers fetch,
          # and aarch64-linux has a native runner, so there is no reason to
          # fake it (SPEC V2).
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Pushing is a main-branch action. Pull requests -- including from forks,
      # which have no secrets at all -- build and prove they build, but do not
      # write to the cache (SPEC V5).
      #
      # The token must be a per-cache token with WRITE on `pr0d1r2`, not a
      # personal token: with the wrong scope cachix logs a 403 and the job
      # still goes green, which is exactly how ../nix-hk shipped an empty cache
      # for a while. T17's separate job is what actually catches that.
      - uses: cachix/cachix-action@v17
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          # Upload what this repo produces, not the nixpkgs closure it merely
          # used -- cache.nixos.org already serves that, and mirroring it burns
          # our storage to no one's benefit (SPEC V10). The vendor tarball is
          # ours but is a build-time input consumers never fetch, so it is
          # filtered too.
          pushFilter: "(-source$|-vendor$|-vendor-staging$|\\.tar\\.gz$)"

      - name: Build fakecloud
        run: nix build .#fakecloud --print-build-logs

      - name: Check the binary reports its own version (SPEC V1)
        run: ./result/bin/fakecloud --version | grep -q '0\.44\.10'

      - name: Record the store path for the cache check
        run: nix path-info .#fakecloud > store-path.txt

      - name: Publish the store path for the verify-cache job
        uses: actions/upload-artifact@v7
        with:
          name: store-path-${{ matrix.system }}
          path: store-path.txt
          if-no-files-found: error

  verify-cache:
    name: verify cache
    # A separate job, not a step in the build job. cachix-action pushes from a
    # post-run hook, so an assertion inside the build job races it and can pass
    # before anything has been uploaded (SPEC V15, ../nix-hk B3-B5).
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: store-path-*
          path: store-paths

      - name: Assert every tier-1 path is in the cache and signed
        run: ./.github/scripts/verify-cache.sh store-paths
